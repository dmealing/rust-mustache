[package]
name = "mustache-ng"
description = "Rust implementation of Mustache (maintained fork of the mustache crate)"
repository = "https://github.com/dmealing/rust-mustache"
documentation = "https://docs.rs/mustache-ng"
readme = "README.md"
keywords = ["mustache", "template", "templating"]
categories = ["template-engine"]
version = "0.10.0"
authors = ["erick.tryzelaar@gmail.com"]
license = "MIT/Apache-2.0"
edition = "2021"
autotests = false
exclude = ["spec/"]

[lib]
name = "mustache"

[features]
unstable = []

[dependencies]
log = "0.4"
serde = "1"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[[test]]
name = "test"
path = "tests/test.rs"
